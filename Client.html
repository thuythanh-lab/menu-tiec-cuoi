<script>
(function(){'use strict';
const app=document.getElementById('app'),PREVIEW=!(window.google&&google.script&&google.script.run),TOKEN=(window.BOOT||{}).token||'',KEY='seasons-minh-thuy-v1',SERVER_KEY=KEY+'-demo-confirmed';
let state=initialState_(),localDraft=null,confirmed=null,loading=!PREVIEW,busy=false,loadError='',saveError='',editing=false,reviewReturn=0,pendingSave=null,toastTimer;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(_){return null;}};
function validDraft(d){if(!d||!d.selections)return null;try{const fresh=initialState_();try{d.pricing=validatePricing_(d.pricing);}catch(_){d.pricing=defaultPricing_();}CATEGORIES.forEach(c=>{if(selectedDish_(d.selections,c))fresh.selections[c.id]=d.selections[c.id];});return Object.assign(fresh,d,{selections:fresh.selections,category:Math.max(0,Math.min(10,Number(d.category)||0))});}catch(_){return null;}}
localDraft=validDraft(read(KEY));if(localDraft)state=JSON.parse(JSON.stringify(localDraft));state.pricing=defaultPerGuestPricing_();state.screen='welcome';
function complete(){return CATEGORIES.filter(c=>selectedDish_(state.selections,c)).length;}
function persist(){state.updatedAt=Date.now();pendingSave=null;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){toast('Trình duyệt không lưu được bản nháp. Hãy giữ trang mở đến khi lưu xong.');}localDraft=JSON.parse(JSON.stringify(state));}
function toast(s){document.getElementById('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4200);}
function go(screen){state.screen=screen;saveError='';render();window.scrollTo({top:0,behavior:'instant'});const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
function badges(d){return d.packages.map(id=>'<span class="badge">'+esc(PACKAGES.find(p=>p.id===id).name)+'</span>').join('');}
function btn(text,action,kind='',extra=''){return '<button type="button" class="btn '+kind+'" data-action="'+action+'" '+extra+'>'+text+'</button>';}
function footer(left,la,right,ra,disabled=false){return '<nav class="bottom" aria-label="Điều hướng"><div class="bottom-inner">'+btn(left,la,'secondary')+btn(right,ra,'',disabled?'disabled':'')+'</div></nav>';}
function pricingInfo(){return '<details><summary>Giá thực đơn được tính thế nào?</summary><p>Giá của các gói Cơ bản, Tiêu chuẩn, Cao cấp và Đặc biệt là giá thực đơn mẫu trọn gói cho một khách, không phải giá riêng của từng món. Bố mẹ có thể kết hợp món từ nhiều gói. Giá thực đơn kết hợp sẽ được nhà hàng Seasons xác nhận sau khi lựa chọn.</p><p>Tên các gói do gia đình đặt để phân biệt, không phải tên chính thức của Seasons. Giá thực đơn kết hợp sẽ được Seasons xác nhận.</p></details>';}
const flower='<svg class="flower" aria-hidden="true" viewBox="0 0 180 130" fill="none"><g stroke="#81917D" stroke-width="1.3"><path d="M90 126C83 82 100 60 133 22M88 108C57 86 46 63 40 32M94 91C120 83 143 62 157 42M84 97C65 75 69 50 75 30"/><path d="M110 52C105 29 122 19 129 20C126 36 119 48 110 52Z" fill="#dde3d5"/><path d="M66 78C44 79 26 64 25 55C42 55 58 65 66 78Z" fill="#dde3d5"/><path d="M116 80C126 58 140 59 148 62C139 72 128 78 116 80Z" fill="#dde3d5"/></g><g fill="#FFFDF7" stroke="#c9b898" stroke-width=".8"><ellipse cx="79" cy="32" rx="7" ry="12" transform="rotate(-15 79 32)"/><ellipse cx="88" cy="41" rx="7" ry="12" transform="rotate(65 88 41)"/><ellipse cx="78" cy="49" rx="7" ry="12"/><ellipse cx="68" cy="42" rx="7" ry="12" transform="rotate(-60 68 42)"/><ellipse cx="132" cy="24" rx="7" ry="11"/><ellipse cx="141" cy="32" rx="7" ry="11" transform="rotate(70 141 32)"/><ellipse cx="132" cy="41" rx="7" ry="11"/><ellipse cx="123" cy="32" rx="7" ry="11" transform="rotate(-65 123 32)"/></g><g fill="#c4a66c"><circle cx="78" cy="40" r="3"/><circle cx="132" cy="32" r="3"/></g></svg>';
function welcome(){return '<section class="intro center">'+flower+'<p class="eyebrow">Ngày vui của gia đình</p><h1>MINH <i>&</i> THỦY</h1><p class="date">24.12.2026</p><hr class="rule"><h2>Chọn thực đơn<br>tiệc cưới</h2><p class="muted">Bố mẹ cùng chọn những món ăn yêu thích cho ngày vui của Minh & Thủy nhé!</p><div class="stats"><div><strong>11</strong><span>nhóm món</span></div><div><strong>156</strong><span>món để chọn</span></div><div><strong>4</strong><span>thực đơn mẫu</span></div></div>'+btn(localDraft?'Tiếp tục chọn món':'Bắt đầu chọn món →','start','full',loading?'disabled':'')+(confirmed?btn('Xem thực đơn đã lưu','load-confirmed','secondary full'):'')+(localDraft&&confirmed&&localDraft.updatedAt>Date.parse(confirmed.savedAt)?'<p class="notice">Có bản nháp trên máy mới hơn bản đã lưu. “Tiếp tục” dùng bản nháp; “Xem thực đơn đã lưu” dùng bản trên Google Sheets.</p>':'')+(loading?'<p class="status" role="status">Đang kiểm tra thực đơn đã lưu…</p>':'')+(loadError?'<p class="error">'+esc(loadError)+'</p>'+btn('Thử tải lại','retry-load','secondary full'):'')+'<p class="footer-note">SEASONS · ĐÀO DUY ANH, HÀ NỘI</p></section>'+pricingInfo();}
function choose(){const c=CATEGORIES[state.category],selected=state.selections[c.id];return '<p class="eyebrow">Chọn thực đơn</p><div class="row"><span>Nhóm '+String(state.category+1).padStart(2,'0')+' / 11</span><span class="small">Đã chọn '+complete()+'/11</span></div><div class="progress"><span style="width:'+complete()/11*100+'%"></span></div><h1 class="group-title">'+esc(c.name)+'</h1><p class="muted">'+(c.id==='c09'?'Cơm tám đã được chọn sẵn cho bố mẹ.':'Chọn 1 món bố mẹ thích nhất')+'</p><div role="radiogroup" aria-label="'+esc(c.name)+'">'+c.dishes.map(d=>'<button type="button" class="dish" role="radio" aria-checked="'+(selected===d.id)+'" data-dish="'+d.id+'"><span class="dish-name">'+esc(d.name)+'</span><span>'+badges(d)+'</span><span class="select-text"><span class="radio">'+(selected===d.id?'✓':'')+'</span>'+(selected===d.id?'Đã chọn món này':'Chọn món này')+'</span></button>').join('')+'</div><button class="link" data-action="quick-review">Xem món đã chọn ('+complete()+'/11)</button>'+pricingInfo()+footer(editing?'Hủy đổi món':'← Quay lại',editing?'cancel-edit':'prev',editing?'Xong, xem thực đơn':state.category===10?'Xem thực đơn →':'Tiếp theo →',editing?'finish-edit':'next',!selected);}
function menuRows(edit=true){return CATEGORIES.map((c,i)=>{const d=selectedDish_(state.selections,c);return '<div class="course"><p class="eyebrow">'+String(i+1).padStart(2,'0')+' — '+esc(c.name)+'</p><span class="dish-name">'+esc(d?d.name:'Chưa chọn món')+'</span>'+(d?badges(d):'')+(edit?'<div><button class="link" data-edit="'+i+'">'+(d?'Đổi món →':'Chọn món →')+'</button></div>':'')+'</div>';}).join('');}
function priceCard(){if(complete()!==11)return '';const e=estimatePerGuest_(state.selections);return '<section class="total unit-price" aria-label="Ước tính cho một khách"><span class="eyebrow">Ước tính cho một khách</span><strong>Khoảng '+money_(e.rounded)+'<span class="unit-label">/khách</span></strong><p>Giá ước tính tham khảo. Giá cuối cùng do Seasons xác nhận.</p></section><details><summary>Cách ước tính</summary><p>Ước tính tham khảo dựa trên trung bình giá các gói mẫu có món bố mẹ đã chọn. Mức hiển thị được làm tròn đến 10.000đ.</p><p>Món có trong nhiều gói chỉ tính một lần, dùng trung bình các gói có món đó. Đây là cách ước lượng từ giá gói, không phải giá từng món hay báo giá thực đơn kết hợp của Seasons; chưa tính phụ thu đổi món nếu có.</p></details>';}
function review(){const full=complete()===11;return '<div class="center">'+flower+'<p class="eyebrow">Thực đơn tiệc cưới</p><h1>Minh & Thủy</h1><p>24.12.2026<br><span class="small muted">Seasons – Đào Duy Anh</span></p></div>'+priceCard()+menuRows()+(full?'<div class="panel sage"><h3>Bố mẹ đã chọn đủ 11 món!</h3><p>Mình xem lại một lần rồi xác nhận nhé.</p></div><div class="actions">'+btn('In / lưu PDF','print','secondary')+btn('Sao chép thực đơn','copy-menu','secondary')+'</div>'+btn('Sao chép yêu cầu báo giá','copy-quote','secondary full'):'<p class="notice">Đã chọn '+complete()+'/11 nhóm. Bố mẹ chọn thêm các món còn thiếu nhé.</p>')+footer('Quay lại chỉnh sửa','resume',full?'Kiểm tra & lưu':'Tiếp tục chọn món',full?'confirm':'resume');}
function budget(){return review();}
function confirmPage(){return '<p class="eyebrow">Bước cuối cùng</p><h1>Xác nhận<br>thực đơn cưới</h1><div class="panel"><h3>Thông tin tiệc cưới</h3><p>Minh & Thủy · 24/12/2026<br>Seasons – Đào Duy Anh</p></div>'+priceCard()+'<h3>Thực đơn đã chọn</h3>'+menuRows(false)+'<p class="small muted">Xác nhận này lưu lựa chọn của gia đình; không phải đặt tiệc hay chấp nhận báo giá với nhà hàng.</p>'+(saveError?'<div class="error" role="alert">'+esc(saveError)+'</div>'+(/CONFLICT/.test(saveError)?btn('Tải thực đơn mới nhất','reload-conflict','secondary full'):''):'')+footer('← Chỉnh sửa','review',busy?'Đang lưu…':PREVIEW?'✓ Xác nhận & lưu trên máy':'✓ Xác nhận & lưu thực đơn','save',busy||loading||!!loadError);}
function success(){return '<div class="center intro"><div class="success-mark">✓</div><p class="eyebrow">Minh & Thủy · 24.12.2026</p><h1>'+(PREVIEW?'Đã lưu bản dùng thử!':'Đã lưu thực đơn<br>thành công!')+'</h1><p>'+(PREVIEW?'Bản dùng thử lưu trên trình duyệt này. Khi triển khai Apps Script, cùng thao tác sẽ lưu vào Google Sheets.':'Thực đơn của Minh & Thủy đã được lưu lại. Bố mẹ có thể xem lại hoặc chỉnh sửa bất cứ lúc nào.')+'</p>'+btn('Xem thực đơn','review','full')+btn('Chỉnh sửa thực đơn','resume','secondary full')+'<p class="small muted">'+esc(confirmed?new Date(confirmed.savedAt).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'')+'</p></div>';}
function render(){document.querySelector('.bottom')?.remove();app.innerHTML='<header class="mast"><span class="brand">m & t</span><button data-action="home">Minh & Thủy · 24.12.26</button></header>'+(PREVIEW?'<div class="notice small">Bản dùng thử · lưu trên thiết bị. Chưa kết nối Google Sheets.</div>':'')+'<div class="fade">'+({welcome,choose,review,budget,confirm:confirmPage,success}[state.screen]||welcome)()+'</div>';const nav=app.querySelector('.bottom');if(nav)document.body.append(nav);}
function textMenu(){return 'THỰC ĐƠN TIỆC CƯỚI – MINH & THỦY\n24/12/2026 · Seasons – Đào Duy Anh\n\n'+CATEGORIES.map((c,i)=>{const d=selectedDish_(state.selections,c);return (i+1)+'. '+(d?d.name:'Chưa chọn');}).join('\n');}
function quote(){const e=estimatePerGuest_(state.selections),ref=e.reference,different=CATEGORIES.filter(c=>!selectedDish_(state.selections,c).packages.includes(ref.id));return 'Chào Seasons, gia đình mình đã chọn thực đơn dự kiến cho tiệc cưới ngày 24/12/2026 của Minh & Thủy.\n\n'+textMenu()+'\n\nƯớc tính tự động từ trung bình giá các gói có món đã chọn: khoảng '+money_(e.rounded)+'/khách; chưa phải báo giá nhà hàng.\nMón khác gói tham khảo:\n'+(different.map(c=>'- '+c.name+': '+selectedDish_(state.selections,c).name).join('\n')||'Không có.')+'\n\nNhờ Seasons báo giá trọn gói/khách cho thực đơn kết hợp này và xác nhận các chi phí phát sinh nếu có. Cảm ơn Seasons!';}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Đã sao chép, bố mẹ có thể dán vào Zalo hoặc Messenger.');}catch(_){let box=document.createElement('textarea');box.className='copy-fallback';box.value=text;app.append(box);box.focus();box.select();toast('Nhấn giữ phần chữ đã chọn rồi chọn Sao chép nhé.');}}
function printMenu(){document.getElementById('print-menu').innerHTML='<h1>MINH & THỦY</h1><p class="print-date">24.12.2026</p><p>SEASONS – ĐÀO DUY ANH</p><hr class="rule"><h2>THỰC ĐƠN TIỆC CƯỚI</h2><ol>'+CATEGORIES.map(c=>'<li>'+esc(selectedDish_(state.selections,c)?.name||'')+'</li>').join('')+'</ol>';window.print();}
function rpc(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||'Không kết nối được Google Sheets.')))[name](TOKEN,...args);});}
async function load(){loading=true;loadError='';render();try{confirmed=PREVIEW?read(SERVER_KEY):await rpc('loadConfirmed');if(!localDraft&&confirmed)adopt(confirmed,false);}catch(err){loadError='Chưa tải được bản đã lưu. Bố mẹ vẫn có thể chọn món; hãy thử tải lại trước khi xác nhận. '+err.message;}finally{loading=false;render();}}
function adopt(r,touch=true){state.selections=JSON.parse(JSON.stringify(r.selections));state.pricing=defaultPerGuestPricing_();state.pricing.reference=matches_(r.selections)[0].id;state.baseRevision=r.revision;state.category=0;state.updatedAt=Date.parse(r.savedAt);if(touch){localDraft=null;pendingSave=null;try{localStorage.removeItem(KEY);}catch(_){}}}
async function save(){if(busy||loading||loadError)return;try{const data=normalized_(state);if(!pendingSave)pendingSave=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)+'-save');busy=true;saveError='';render();let result;
if(PREVIEW){const old=read(SERVER_KEY);if((old?.revision||null)!==(state.baseRevision||null))throw Error('CONFLICT: Có bản dùng thử mới hơn. Tải lại bản đã lưu.');result={...data,revision:pendingSave,savedAt:new Date().toISOString(),estimate:estimate_(data.pricing,data.selections)};localStorage.setItem(SERVER_KEY,JSON.stringify(result));}else result=await rpc('saveConfirmed',data,pendingSave,state.baseRevision);
confirmed=result;state.baseRevision=result.revision;state.updatedAt=Date.parse(result.savedAt);state.screen='success';try{localStorage.removeItem(KEY);}catch(_){}localDraft=null;pendingSave=null;go('success');}catch(err){saveError=err.message||'Chưa lưu được. Bản nháp vẫn được giữ, bố mẹ thử lại nhé.';render();}finally{busy=false;render();}}
function suggest(){state.pricing=defaultPerGuestPricing_();state.pricing.reference=matches_(state.selections)[0].id;}
let beforeEdit;
function action(a){if(busy)return;switch(a){case'home':go('welcome');break;case'start':editing=false;go('choose');break;case'prev':if(state.category===0)go('welcome');else{state.category--;persist();go('choose');}break;case'next':if(!state.selections[CATEGORIES[state.category].id])return;if(state.category===10)go('review');else{state.category++;persist();go('choose');}break;case'quick-review':reviewReturn=state.category;go('review');break;case'resume':editing=false;state.category=CATEGORIES.findIndex(c=>!selectedDish_(state.selections,c));if(state.category<0)state.category=reviewReturn;go('choose');break;case'cancel-edit':state.selections[CATEGORIES[state.category].id]=beforeEdit;suggest();persist();editing=false;go('review');break;case'finish-edit':editing=false;go('review');break;case'review':go('review');break;case'budget':if(complete()===11){suggest();persist();go('budget');}break;case'confirm':try{suggest();normalized_(state);go('confirm');}catch(err){toast(err.message);}break;case'print':printMenu();break;case'copy-menu':copy(textMenu());break;case'copy-quote':try{copy(quote());}catch(err){toast(err.message);}break;case'save':save();break;case'load-confirmed':if(confirmed){adopt(confirmed);go('review');}break;case'retry-load':load();break;case'reload-conflict':load().then(()=>{if(confirmed&&!loadError){adopt(confirmed);go('review');}});break;}}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled||busy)return;if(el.dataset.dish){const c=CATEGORIES[state.category];if(!c.dishes.some(d=>d.id===el.dataset.dish))return;state.selections[c.id]=el.dataset.dish;suggest();persist();const scroll=window.scrollY;render();window.scrollTo(0,scroll);app.querySelector('[data-dish="'+el.dataset.dish+'"]')?.focus({preventScroll:true});}else if(el.dataset.edit!==undefined){state.category=Number(el.dataset.edit);beforeEdit=state.selections[CATEGORIES[state.category].id];editing=true;go('choose');}else if(el.dataset.action)action(el.dataset.action);});
window.addEventListener('storage',e=>{if(e.key===KEY)toast('Bản nháp trên tab khác vừa thay đổi. Hãy dùng một tab để chọn món.');});
render();load();
})();
</script>
